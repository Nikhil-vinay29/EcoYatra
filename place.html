<!DOCTYPE html>
<html>
<head>

<title>EcoYatra Place</title>

<link rel="stylesheet" href="place.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar">

<div class="nav-left">
<img src="logo.png" class="logo" alt="EcoYatra Logo">
</div>

<div class="nav-right">
<a href="welcome.html" class="about">Back to States</a>
</div>

</nav>


<h1 id="place-name"></h1>


<div class="place-container">

<div class="left">
<img id="place-image" alt="Place Image">
</div>

<div class="right">

<h2>About</h2>
<p id="place-description"></p>

<h3>Location</h3>
<p id="place-location"></p>

<h3>Estimated Budget</h3>
<p id="place-budget"></p>

<h3>Nearby Hotels</h3>
<ul id="place-hotels"></ul>

<h3>Food & Restaurants</h3>
<ul id="place-food"></ul>

</div>

</div>


<hr>


<!-- Feedback Section -->

<button id="feedbackBtn">Give Feedback</button>


<div id="feedbackForm" class="feedback-form">

<h3>Share Your Experience</h3>

<input type="text" id="name" placeholder="Your Name">

<select id="rating">
<option value="">Select Rating</option>
<option value="5">⭐⭐⭐⭐⭐ Excellent</option>
<option value="4">⭐⭐⭐⭐ Good</option>
<option value="3">⭐⭐⭐ Average</option>
<option value="2">⭐⭐ Poor</option>
<option value="1">⭐ Bad</option>
</select>

<textarea id="comment" placeholder="Write your feedback"></textarea>

<button onclick="submitFeedback()">Submit</button>

</div>


<h3>User Reviews</h3>

<div id="commentsContainer"></div>


<footer>
<p>© 2026 EcoYatra</p>
</footer>


<script src="placeData.js"></script>
<script src="place.js"></script>

</body>
</html>
